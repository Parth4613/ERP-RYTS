name: gas_company
description: "Gas Pipeline ERP — Production-grade operational ERP for Gas Pipeline Installation Company"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.12.4

  # Riverpod
  flutter_riverpod: ^3.0.3
  riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^14.8.1

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  fl_chart: ^0.70.2
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8

  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^10.1.4

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.2
  flutter_dotenv: ^5.0.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.14
  freezed: ^3.0.3
  json_serializable: ^6.9.4
  riverpod_generator: ^3.0.3

  mocktail: ^1.0.4
flutter:
  uses-material-design: true
